<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Grade 3 Reasoning Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column like a workbook page; one question at a time, big tappable answers. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#1D2833; --muted:#5B6976; --line:#D5DDE4;
  --accent:#17796A; --accent-ink:#FFFFFF; --accent-soft:#DDF0EC; --sun:#E9A72E;
  --good:#2C8A4B; --good-soft:#E1F3E6; --bad:#C0463B; --bad-soft:#F8E3E0;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11181F; --surface:#1A232C; --ink:#E5ECF1; --muted:#9AA8B4; --line:#2C3843;
  --accent:#4EC2A8; --accent-ink:#0D1A17; --accent-soft:#183A34; --sun:#F2BD55;
  --good:#5CC57E; --good-soft:#173322; --bad:#EE7A6E; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181F; --surface:#1A232C; --ink:#E5ECF1; --muted:#9AA8B4; --line:#2C3843;
  --accent:#4EC2A8; --accent-ink:#0D1A17; --accent-soft:#183A34; --sun:#F2BD55;
  --good:#5CC57E; --good-soft:#173322; --bad:#EE7A6E; --bad-soft:#3A1E1B; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.2rem;font-weight:800}
h2{font-size:1.5rem;font-weight:800}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* home */
.hero{display:flex;flex-direction:column;gap:8px}
.daily{background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:20px 22px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:16px}
.daily h2{font-size:1.6rem}
.daily .go{font-family:var(--display);font-size:2rem;font-weight:800}
.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.sections{grid-template-columns:1fr}}
.sec{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.sec:hover{border-color:var(--accent)}
.sec h3{font-size:1.25rem}
.sec .count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.history{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:14px;border:1.5px solid var(--line)}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hrow:first-child{border-top:0}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--ink)}
.notice{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.card{background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;border:1.5px solid var(--line)}
.prompt{font-size:1.3rem;font-weight:500;line-height:1.4;white-space:pre-wrap}
.figure{display:flex;justify-content:center;color:var(--ink)}
.figure svg{max-width:100%;height:auto;max-height:200px;width:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.pics{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.opts{grid-template-columns:1fr}.opts.pics{grid-template-columns:repeat(2,1fr)}}
.opt{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.1rem;text-align:left;min-width:0}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.9rem}
.opts.pics .opt{flex-direction:column;justify-content:center;padding:10px}
.opt svg{width:64px;height:64px}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.good{background:var(--good-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback b{font-family:var(--display);font-size:1.25rem}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* results */
.score{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stars{color:var(--sun);font-size:1.8rem;letter-spacing:4px}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rv svg{max-height:110px;width:auto;max-width:100%}
footer{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<div class="wrap" id="app">
  <div class="hero">
    <span class="eyebrow">CCAT-style practice</span>
    <h1>Thinking Practice</h1>
    <p class="muted">Loading questions…</p>
  </div>
</div>

ll=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"48.0,30.0 39.0,45.6 21.0,45.6 12.0,30.0 21.0,14.4 39.0,14.4\"/><\/svg>", "<svg viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"14.7,14.7 45.3,14.7 45.3,45.3 14.7,45.3\" fill=\"currentColor\"/><\/svg>", "<svg viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"30.0,13.8 46.4,42.2 13.6,42.2\"/><circle cx=\"30\" cy=\"48\" r=\"3\" fill=\"currentColor\"/><\/svg>", "<svg viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"30.0,12.0 34.8,23.4 47.1,24.4 37.7,32.5 40.6,44.6 30.0,38.1 19.4,44.6 22.3,32.5 12.9,24.4 25.2,23.4\"/><circle cx=\"30\" cy=\"31\" r=\"3\" fill=\"currentColor\"/><\/svg>"], "answer": 3, "explain": "Each shape has a dot right in the middle of it. Only the star has a dot inside it in the middle.", "order": 43, "figure": "<svg viewBox=\"0 0 196 60\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><g transform=\"translate(0 0)\"><circle cx=\"30\" cy=\"30\" r=\"18\"/><circle cx=\"30\" cy=\"30\" r=\"3\" fill=\"currentColor\"/><\/g><g transform=\"translate(68 0)\"><polygon points=\"14.7,14.7 45.3,14.7 45.3,45.3 14.7,45.3\"/><circle cx=\"30\" cy=\"30\" r=\"3\" fill=\"currentColor\"/><\/g><g transform=\"translate(136 0)\"><polygon points=\"30.0,12.0 47.1,24.4 40.6,44.6 19.4,44.6 12.9,24.4\"/><circle cx=\"30\" cy=\"31\" r=\"3\" fill=\"currentColor\"/><\/g><\/svg>", "_id": "n12"}]</script>
<script>
const SECTIONS = {
  verbal:{name:"Words", blurb:"Analogies, word groups and finishing sentences"},
  quantitative:{name:"Numbers", blurb:"Number patterns, number pairs and puzzles"},
  nonverbal:{name:"Shapes", blurb:"Picture patterns, shape groups and changes"}
};
const DAILY_SIZE = 10;
const S = {questions:[], attempts:[], loaded:false, view:"home", quiz:null};
const KEY = "reasoning-practice-rounds";
function loadRounds(){ try{ const v = JSON.parse(localStorage.getItem(KEY)||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
const app = document.getElementById("app");

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?"":v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
function safeSvg(str){
  if (typeof str!=="string" || !str.trim().startsWith("<svg")) return null;
  try{
    const doc = new DOMParser().parseFromString(str, "image/svg+xml");
    const root = doc.documentElement;
    if (root.nodeName!=="svg" || doc.querySelector("parsererror")) return null;
    root.querySelectorAll("script,foreignObject,iframe,a,image,use").forEach(n=>n.remove());
    for (const n of [root, ...root.querySelectorAll("*")])
      for (const a of [...n.attributes]) if (/^on/i.test(a.name) || /href/i.test(a.name)) n.removeAttribute(a.name);
    return document.importNode(root, true);
  }catch(e){ return null; }
}
function content(str){ return safeSvg(str) || document.createTextNode(String(str??"")); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function valid(q){ return q && Array.isArray(q.options) && q.options.length>=2 && Number.isInteger(q.answer) && q.answer>=0 && q.answer<q.options.length && q.prompt; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }catch(e){ return ""; } }
function sameDay(a,b){ return a.toDateString()===b.toDateString(); }

function streak(){
  const days = new Set(S.attempts.map(a=>{ try{return new Date(a.at).toDateString();}catch(e){return "";} }));
  let n=0; const d=new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  while (days.has(d.toDateString())){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function render(){
  app.replaceChildren(...(S.view==="quiz" ? quizView() : S.view==="results" ? resultsView() : homeView()));
  window.scrollTo({top:0});
}

function homeView(){
  const out = [];
  const st = streak();
  const today = S.attempts.filter(a=>sameDay(new Date(a.at), new Date())).length;
  out.push(h("div",{class:"hero"},
    h("span",{class:"eyebrow"},"CCAT-style practice · Grade 3"),
    h("h1",{},"Thinking Practice"),
    h("p",{class:"muted"}, st>1 ? `${st} days in a row. Keep it going!` : today ? "Nice work today. Want another round?" : "A little practice every day. Pick a round to start.")
  ));
  if (!S.loaded){ out.push(h("p",{class:"muted"},"Loading questions…")); return out; }
  const qs = S.questions;
  if (!qs.length){
    out.push(h("div",{class:"notice"},h("h3",{},"No questions yet"),h("p",{class:"muted"},"Questions are added from the Claude chat for this project.")));
    return out;
  }
  out.push(h("button",{class:"daily",onclick:()=>start("daily")},
    h("div",{},h("span",{class:"eyebrow",style:"color:inherit;opacity:.8"},"Today's round"),h("h2",{},`${Math.min(DAILY_SIZE,qs.length)} mixed questions`),h("p",{style:"opacity:.85"},"Words, numbers and shapes")),
    h("span",{class:"go","aria-hidden":"true"},"→")));
  out.push(h("div",{class:"sections"}, Object.entries(SECTIONS).map(([k,s])=>{
    const n = qs.filter(q=>q.section===k).length;
    return h("button",{class:"sec",onclick:()=>start(k),disabled:!n},
      h("h3",{},s.name), h("p",{class:"muted",style:"font-size:.9rem"},s.blurb), h("span",{class:"count"},`${n} question${n===1?"":"s"}`));
  })));
  if (S.attempts.length){
    out.push(h("h2",{style:"font-size:1.2rem;margin-top:8px"},"Recent rounds"));
    out.push(h("div",{class:"history"}, S.attempts.slice(0,7).map(a=>
      h("div",{class:"hrow"}, h("span",{},fmtDate(a.at)," ",h("span",{class:"pill"},a.mode==="daily"?"Mixed":(SECTIONS[a.mode]?.name||a.mode))),
        h("b",{},`${a.correct} / ${a.total}`)))));
  }
  out.push(h("footer",{},`${qs.length} questions in the bank. Scores are saved on this device.`));
  return out;
}

function start(mode){
  let pool = S.questions.filter(valid);
  if (mode!=="daily") pool = pool.filter(q=>q.section===mode);
  else {
    // balance the mix across sections
    const by = Object.keys(SECTIONS).map(k=>shuffle(pool.filter(q=>q.section===k)));
    const mix=[]; let i=0;
    while (mix.length<DAILY_SIZE && by.some(b=>b.length)){ const b=by[i%by.length]; if (b.length) mix.push(b.shift()); i++; }
    pool = mix;
  }
  pool = shuffle(pool);
  if (!pool.length) return;
  S.quiz = {mode, items: pool.map(q=>({q, order: shuffle(q.options.map((_,i)=>i)), chosen:null})), i:0};
  S.view="quiz"; render();
}

function quizView(){
  const z = S.quiz, it = z.items[z.i], q = it.q, done = it.chosen!=null;
  const pics = q.options.every(o=>typeof o==="string" && o.trim().startsWith("<svg"));
  const letters = "ABCDEF";
  const opts = h("div",{class:"opts"+(pics?" pics":"")}, it.order.map((oi,pos)=>{
    let cls="opt";
    if (done && oi===q.answer) cls+=" right";
    else if (done && oi===it.chosen) cls+=" wrong";
    return h("button",{class:cls,disabled:done,"aria-label":pics?`Choice ${letters[pos]}`:null,onclick:()=>{ it.chosen=oi; render(); }},
      h("span",{class:"k"},letters[pos]), content(q.options[oi]));
  }));
  const right = it.chosen===q.answer;
  return [
    h("div",{class:"qtop"},
      h("button",{class:"btn ghost",style:"padding:8px 14px",onclick:()=>{S.view="home";S.quiz=null;render();}},"Exit"),
      h("div",{class:"bar",role:"progressbar","aria-valuemin":"0","aria-valuemax":z.items.length,"aria-valuenow":z.i+(done?1:0)},h("i",{style:`width:${((z.i+(done?1:0))/z.items.length)*100}%`})),
      h("span",{class:"num"},`${z.i+1} of ${z.items.length}`)),
    h("div",{class:"card"},
      h("span",{class:"eyebrow"},`${SECTIONS[q.section]?.name||""} · ${q.type||""}`),
      h("p",{class:"prompt"},q.prompt),
      q.figure ? h("div",{class:"figure"},content(q.figure)) : null,
      opts,
      done ? h("div",{class:"feedback "+(right?"good":"bad")},
        h("b",{},right?"Correct!":"Not quite."), q.explain ? h("p",{},q.explain) : null) : null,
      done ? h("div",{class:"row",style:"justify-content:flex-end"},
        h("button",{class:"btn",onclick:next,id:"nextbtn"}, z.i+1<z.items.length?"Next question":"See my score")) : null)
  ];
}

function next(){
  const z=S.quiz;
  if (z.i+1<z.items.length){ z.i++; render(); return; }
  z.correct = z.items.filter(it=>it.chosen===it.q.answer).length;
  S.view="results"; render(); save(z);
}

function save(z){
  const rec = {at:new Date().toISOString(), mode:z.mode, total:z.items.length, correct:z.correct,
    items:z.items.map(it=>({id:it.q._id, correct:it.chosen===it.q.answer}))};
  S.attempts = [rec, ...S.attempts].slice(0,200);
  try{ localStorage.setItem(KEY, JSON.stringify(S.attempts)); }catch(e){}
}

function resultsView(){
  const z=S.quiz, pct=z.correct/z.items.length;
  const stars = pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const missed = z.items.filter(it=>it.chosen!==it.q.answer);
  const bySec = Object.keys(SECTIONS).map(k=>{ const xs=z.items.filter(it=>it.q.section===k); return [k,xs.filter(it=>it.chosen===it.q.answer).length,xs.length]; }).filter(x=>x[2]);
  return [
    h("div",{class:"card",style:"align-items:flex-start"},
      h("span",{class:"eyebrow"},"Round finished"),
      h("div",{class:"score"},`${z.correct} / ${z.items.length}`),
      h("div",{class:"stars","aria-label":`${stars} of 3 stars`},"★".repeat(stars)+"☆".repeat(3-stars)),
      h("p",{},pct===1?"Perfect round!":pct>=.7?"Great thinking!":"Good effort. Look over the ones you missed below."),
      bySec.length>1 ? h("p",{class:"muted"},bySec.map(([k,c,t])=>`${SECTIONS[k].name} ${c}/${t}`).join(" · ")) : null,
      h("div",{class:"row"},
        h("button",{class:"btn",onclick:()=>start(z.mode)},"Try another round"),
        h("button",{class:"btn ghost",onclick:()=>{S.view="home";S.quiz=null;render();}},"Home"))),
    missed.length ? h("h2",{style:"font-size:1.2rem"},"Let's look at the tricky ones") : null,
    h("div",{class:"review"}, missed.map(it=>h("div",{class:"rv"},
      h("span",{class:"eyebrow"},it.q.type||""),
      h("p",{style:"font-weight:500"},it.q.prompt),
      it.q.figure ? h("div",{class:"figure",style:"justify-content:flex-start"},content(it.q.figure)) : null,
      h("p",{},"Answer: ", content(it.q.options[it.q.answer])),
      it.q.explain ? h("p",{class:"muted"},it.q.explain) : null)))
  ];
}

function boot(){
  let bank=[];
  try{ bank = JSON.parse(document.getElementById("bank").textContent||"[]"); }catch(e){ bank=[]; }
  S.questions = bank.filter(valid).sort((a,b)=>(a.order||0)-(b.order||0));
  S.attempts = loadRounds();
  S.loaded = true;
  render();
}
boot();
</script>
</body></html>
